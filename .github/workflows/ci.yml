name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kiem-tra:
    name: Lint, typecheck, build, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Bản CI không bao giờ lập chỉ mục (CLAUDE.md, quy tắc 12).
      NEXT_PUBLIC_CHO_PHEP_LAP_CHI_MUC: "false"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cài thư viện
        run: npm ci

      - name: Quét từ cấm
        run: npm run check:words

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Cài Chromium cho Playwright
        run: npx playwright install --with-deps chromium

      - name: Test (Playwright và axe)
        run: npm run test

      - name: Lưu báo cáo test khi lỗi
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
